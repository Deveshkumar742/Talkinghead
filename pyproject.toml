[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "talkinghead"
version = "0.1.0"
description = "Text to talking-head video using your own face and cloned voice. Zero-cost, commercially-licensed model stack."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
]

# Heavy ML deps are NOT top-level. Phase 1 (script prep, ffmpeg assembly, CLI)
# must install and test on a laptop with no GPU and no torch.
[project.optional-dependencies]
tts = ["chatterbox-tts>=0.1.1", "torch>=2.3", "torchaudio>=2.3"]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]

[project.scripts]
talkinghead = "talkinghead.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["talkinghead"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
